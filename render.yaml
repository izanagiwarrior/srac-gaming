services:
  - type: web
    name: srac-gaming
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
